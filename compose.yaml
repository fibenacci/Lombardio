  JAVA_TOOL_OPTIONS: "${JAVA_LIGHT_TOOL_OPTIONS:--XX:ActiveProcessorCount=1 -XX:InitialRAMPercentage=5 -XX:MaxRAMPercentage=50 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom}"
  INTEGRATION_RABBITMQ_PUBLISHER_BATCH_SIZE: 10
  INTEGRATION_INTERNAL_SERVICE_TOKEN: "internal-secret-token"
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-lombardio}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lombardio}
  APP_CORS_MAX_AGE_SECONDS: 3600
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  APP_CORS_ALLOWED_METHODS: ${APP_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
  APP_CORS_ALLOWED_HEADERS: ${APP_CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept,X-Requested-With}
  APP_CORS_EXPOSED_HEADERS: ${APP_CORS_EXPOSED_HEADERS:-Content-Disposition,Location}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/lombardio/protocol/openid-connect/certs
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/lombardio
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
  IDENTITY_SECURITY_ENCRYPTION_KEY: ${IDENTITY_SECURITY_ENCRYPTION_KEY:-dev-encryption-key-must-be-32-chars-!!!}

x-java-core-limits: &java-core-limits
  cpus: 2.0
  mem_limit: 1536m

x-java-default-limits: &java-default-limits
  cpus: 1.25
  mem_limit: 1280m

x-java-light-limits: &java-light-limits
  cpus: 1.0
  mem_limit: 1024m

services:
  postgres:
    image: postgres:16-alpine
    container_name: lombardio-postgres
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 768m
    environment:
      POSTGRES_DB: lombardio
      POSTGRES_USER: lombardio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lombardio -d lombardio"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lombardio-rabbitmq
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lombardio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lombardio}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7-alpine
    container_name: lombardio-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.0
    container_name: lombardio-traefik
    command:
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
    ports:
      - "8081:80"      # API Zugang
      - "8082:8080"    # Traefik Dashboard
    volumes:
      - ./infra/dynamic.yaml:/etc/traefik/dynamic.yaml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    container_name: lombardio-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/lombardio
      KC_DB_USERNAME: lombardio
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/lombardio-realm.json:/opt/keycloak/data/import/lombardio-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q :1F90 /proc/net/tcp6"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  platform:
    <<: *java-core-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: platform
    container_name: lombardio-platform
    restart: unless-stopped
    environment:
      <<: *java-core-env
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=platform
      PLATFORM_DB_USERNAME: lombardio
      PLATFORM_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      SPRING_PROFILES_ACTIVE: bootstrap
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: lombardio
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: platform@lombardio.local
      KEYCLOAK_ADMIN_PASSWORD: admin
      IDENTITY_SECURITY_ENCRYPTION_KEY: "dev-encryption-key-must-be-32-chars-!!!"
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  loan-origination:
    profiles: ["ops"]
    <<: *java-default-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: loan-origination
    container_name: lombardio-loan-origination
    restart: unless-stopped
    environment:
      <<: *java-default-env
      LOAN_ORIGINATION_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=loan_origination
      LOAN_ORIGINATION_DB_USERNAME: lombardio
      LOAN_ORIGINATION_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      IDENTITY_BASE_URL: http://identity-intelligence:8084
      PAWN_TICKET_BASE_URL: http://pawn-ticket:8085
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: bootstrap
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  identity-intelligence:
    profiles: ["ops"]
    <<: *java-default-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: identity-intelligence
    container_name: lombardio-identity-intelligence
    restart: unless-stopped
    environment:
      <<: *java-default-env
      IDENTITY_INTELLIGENCE_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=identity_intelligence
      IDENTITY_INTELLIGENCE_DB_USERNAME: lombardio
      IDENTITY_INTELLIGENCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      PAWN_TICKET_BASE_URL: http://pawn-ticket:8085
      INTEGRATION_BASE_URL: http://integration:8092
      REGULA_BASE_URL: http://regula:8080
      PLATFORM_BASE_URL: http://platform:8082
      SPRING_PROFILES_ACTIVE: bootstrap
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  pawn-ticket:
    profiles: ["ops"]
    <<: *java-default-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: pawn-ticket
    container_name: lombardio-pawn-ticket
    restart: unless-stopped
    environment:
      <<: *java-default-env
      PAWN_TICKET_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=pawn_ticket
      PAWN_TICKET_DB_USERNAME: lombardio
      PAWN_TICKET_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: bootstrap
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  auction:
    profiles: ["auction"]
    <<: *java-default-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: auction
    container_name: lombardio-auction
    restart: unless-stopped
    environment:
      <<: *java-default-env
      AUCTION_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=auction
      AUCTION_DB_USERNAME: lombardio
      AUCTION_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: bootstrap
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  online-auction:
    profiles: ["auction"]
    <<: *java-default-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: online-auction
    container_name: lombardio-online-auction
    restart: unless-stopped
    environment:
      <<: *java-default-env
      ONLINE_AUCTION_DB_URL: jdbc:postgresql://postgres:5432/lombardio?currentSchema=online_auction
      ONLINE_AUCTION_DB_USERNAME: lombardio
      ONLINE_AUCTION_DB_PASSWORD: ${POSTGRES_PASSWORD:-lombardio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CENTRIFUGO_BASE_URL: http://centrifugo:8000
      INTEGRATION_RABBITMQ_PUBLISHER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: bootstrap
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  reporting:
    profiles: ["ops"]
    <<: *java-light-limits
    build:
      context: .
      dockerfile: infra/docker/JavaService.Dockerfile
      args:
        SERVICE_NAME: reporting
    container_name: lombardio-reporting
    restart: unless-stopped
    environment:
      <<: *java-light-env
      LOAN_ORIGINATION_BASE_URL: http://loan-origination:8083
      PAWN_TICKET_BASE_URL: http://pawn-ticket:8085
      SPRING_PROFILES_ACTIVE: bootstrap
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy

  regula:
    image: regulaforensics/docreader:latest
    container_name: lombardio-regula
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
      - |
        if [ -f /licenses/regula.license ]; then
          cp /licenses/regula.license /app/extBin/unix/regula.license
          echo "Loaded local Regula license from /licenses/regula.license"
        fi
        exec ./entrypoint.sh
    ports:
      - "8087:8080"
    volumes:
      - ./infra/regula:/licenses:ro

  integration:
    profiles: ["aux"]
    build:
      context: .
      dockerfile: services/integration/build/package/Dockerfile
      target: ${COMPOSE_BUILD_TARGET:-runtime}
    container_name: lombardio-integration
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 384m
    environment:
      GOMAXPROCS: 1
      PORT: 8092
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-lombardio}:${RABBITMQ_PASSWORD:-lombardio}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: lombardio.events
      RABBITMQ_QUEUE: lombardio.integration
      RABBITMQ_BINDING_KEY: "#"
      INTEGRATION_INTERNAL_SERVICE_TOKEN: "internal-secret-token"
      INTEGRATION_EMAIL_DELIVERY_MODE: "log"
      INTEGRATION_WEBHOOK_DESTINATIONS: "[]"
    ports:
      - "8092:8092"
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/app/build/package/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
    container_name: lombardio-frontend
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:8081
      VITE_PLATFORM_API_BASE_URL: http://localhost:8081
      VITE_ORIGINATION_API_BASE_URL: http://localhost:8081
      VITE_IDENTITY_API_BASE_URL: http://localhost:8081
      VITE_PAWN_TICKET_API_BASE_URL: http://localhost:8081
      VITE_AUCTION_API_BASE_URL: http://localhost:8081
      VITE_ONLINE_AUCTION_API_BASE_URL: http://localhost:8081
      VITE_REPORTING_API_BASE_URL: http://localhost:8081
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: lombardio
      VITE_KEYCLOAK_CLIENT_ID: lombardio-app
    ports:
      - "5173:80"
    volumes:
      - ./frontend/app:/workspace
    depends_on:
      keycloak:
        condition: service_healthy
      platform:
        condition: service_started

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    container_name: lombardio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      platform:
        condition: service_started
      loan-origination:
        condition: service_started
      identity-intelligence:
        condition: service_started
      pawn-ticket:
        condition: service_started
      auction:
        condition: service_started
      online-auction:
        condition: service_started
      reporting:
        condition: service_started
      alertmanager:
        condition: service_started

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    container_name: lombardio-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  alertmanager:
    profiles: ["obs"]
    image: prom/alertmanager:v0.27.0
    container_name: lombardio-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    profiles: ["obs"]
    image: grafana/loki:3.1.1
    container_name: lombardio-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro

  promtail:
    profiles: ["obs"]
    image: grafana/promtail:3.1.1
    container_name: lombardio-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

volumes:
  maven-cache:
  postgres-data:
  rabbitmq-data:
  redis-data:

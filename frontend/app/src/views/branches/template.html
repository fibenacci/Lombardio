<section class="page">
  <PageHeader
    eyebrow="Organization"
    title="Branches"
    icon="pi pi-sitemap"
    :copy="
      tenantStore.selectedTenantId
        ? `Review branch rollout status for tenant ${tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId}.`
        : 'Select a tenant before reviewing branch rollout status.'
    "
  />

  <div class="panel-grid">
    <AdminPanel title="Branch Directory" :subtitle="isLoading ? 'Loading...' : `${branches.length} branches`">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <PMessage v-if="successMessage" severity="info" variant="simple">{{ successMessage }}</PMessage>

      <AppDataTable v-if="tenantStore.selectedTenantId" :value="branches" dataKey="id" :loading="isLoading">
        <PColumn field="key" header="Key" sortable />
        <PColumn field="displayName" header="Name" sortable />
        <PColumn header="Status" field="status" sortable>
          <template #body="{ data }">
            <StatusTag :value="data.status" />
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel v-if="canManageBranches" title="Branch Management" subtitle="Create tenant branches for staff assignment">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
        <label>
          <span>Branch key</span>
          <PInputText v-model="form.key" type="text" />
        </label>

        <label>
          <span>Display name</span>
          <PInputText v-model="form.displayName" type="text" />
        </label>

        <label>
          <span>Status</span>
          <PSelect
            v-model="form.status"
            :options="[
              { label: 'ACTIVE', value: 'ACTIVE' },
              { label: 'INACTIVE', value: 'INACTIVE' }
            ]"
            optionLabel="label"
            optionValue="value"
          />
        </label>

        <template #actions>
          <SectionActions>
            <PButton :disabled="!tenantStore.selectedTenantId" icon="pi pi-save" label="Create branch" type="submit" />
            <PButton :disabled="!tenantStore.selectedTenantId || isLoading" icon="pi pi-refresh" label="Reload branches" severity="secondary" outlined type="button" @click="reload" />
          </SectionActions>
        </template>
      </FormShell>
    </AdminPanel>
  </div>
</section>

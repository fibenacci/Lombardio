<section class="page">
  <PageHeader
    eyebrow="Identity Access"
    title="Users"
    icon="pi pi-users"
    :copy="
      tenantStore.selectedTenantId
        ? `Create and maintain staff accounts for tenant ${tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId}.`
        : 'Select a tenant in the Tenants view before managing users.'
    "
  />

  <div class="panel-grid">
    <AdminPanel title="User Directory" :subtitle="isLoading ? 'Loading...' : `${userRows.length} records`">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <PMessage v-if="successMessage" severity="info" variant="simple">{{ successMessage }}</PMessage>
      <AppDataTable v-if="tenantStore.selectedTenantId" :value="userRows" dataKey="id" :loading="isLoading">
        <PColumn field="username" header="Username" sortable />
        <PColumn field="email" header="Email" sortable />
        <PColumn field="displayName" header="Display name" sortable />
        <PColumn header="Status" field="status" sortable>
          <template #body="{ data }">
            <StatusTag :value="data.status" />
          </template>
        </PColumn>
        <PColumn field="branchCount" header="Branches" sortable />
        <PColumn field="roleNames" header="Roles" sortable />
        <PColumn header="Actions">
          <template #body="{ data }">
            <div class="table-actions">
              <PButton
                v-if="canManageUsers"
                icon="pi pi-pencil"
                severity="secondary"
                variant="text"
                rounded
                @click="startEdit(data)"
              />
              <ConfirmAction
                v-if="canDelegateToUser(data)"
                icon="pi pi-user-plus"
                label=""
                severity="secondary"
                variant="text"
                rounded
                header="Start delegated session"
                :message="`You are about to enter the application as ${data.displayName || data.username}.`"
                confirmLabel="Start session"
                @confirm="delegateToUser(data.id)"
              />
            </div>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel v-if="canManageUsers" :title="editingUserId ? 'Edit User' : 'Create User'" subtitle="Writes to the tenant identity provisioning API.">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
          <label>
            <span>Username</span>
            <PInputText v-model="form.username" type="text" />
          </label>

          <label>
            <span>Email</span>
            <PInputText v-model="form.email" type="email" />
          </label>

          <label v-if="!editingUserId">
            <span>Initial password</span>
            <PPassword v-model="form.initialPassword" :feedback="false" toggleMask fluid />
          </label>

          <label>
            <span>Display name</span>
            <PInputText v-model="form.displayName" type="text" />
          </label>

          <label>
            <span>Status</span>
            <PSelect
              v-model="form.status"
              :options="[
                { label: 'ACTIVE', value: 'ACTIVE' },
                { label: 'INACTIVE', value: 'INACTIVE' }
              ]"
              optionLabel="label"
              optionValue="value"
            />
          </label>

          <label>
            <span>Assign tenant roles</span>
            <PMultiSelect v-model="form.roleIds" :options="roleOptions" optionLabel="label" optionValue="value" display="chip" />
          </label>

          <label>
            <span>Assign branches</span>
            <PMultiSelect v-model="form.branchIds" :options="branchOptions" optionLabel="label" optionValue="value" display="chip" />
          </label>

        <template #actions>
          <SectionActions>
            <PButton :disabled="!tenantStore.selectedTenantId" :label="editingUserId ? 'Save user' : 'Create user'" icon="pi pi-save" type="submit" />
            <PButton v-if="editingUserId" icon="pi pi-times" label="Cancel" severity="secondary" outlined type="button" @click="resetForm" />
          </SectionActions>
        </template>
      </FormShell>
    </AdminPanel>
  </div>
</section>

<section class="page">
  <PageHeader
    eyebrow="Platform"
    title="Tenants"
    icon="pi pi-building"
    copy="Create tenants and enable features before tenant administrators manage users and roles."
  />

  <div class="panel-grid">
    <AdminPanel title="Tenant Directory" :subtitle="isLoading ? 'Loading...' : `${tenants.length} tenants`">
      <template #actions>
        <PTag v-if="selectedTenant" severity="info" :value="selectedTenant.displayName" />
      </template>

      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <AppDataTable :value="tenants" dataKey="id" :loading="isLoading">
        <PColumn field="displayName" header="Tenant" sortable>
          <template #body="{ data }">
            <button
              :class="['tenant-row-action', { active: tenantStore.selectedTenantId === data.id }]"
              type="button"
              @click="selectTenant(data.id)"
            >
              <span class="tenant-row-main">
                <strong>{{ data.displayName }}</strong>
                <span class="muted-copy">{{ data.key }}</span>
              </span>
              <PTag :severity="tenantStatusSeverity(data.status)" :value="data.status" />
            </button>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel title="Create Tenant" subtitle="Platform-level tenant bootstrap.">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
          <label>
            <span>Key</span>
            <PInputText v-model="form.key" type="text" />
          </label>

          <label>
            <span>Display name</span>
            <PInputText v-model="form.displayName" type="text" />
          </label>

          <label>
            <span>Status</span>
            <PSelect
              v-model="form.status"
              :options="[
                { label: 'ACTIVE', value: 'ACTIVE' },
                { label: 'INACTIVE', value: 'INACTIVE' }
              ]"
              optionLabel="label"
              optionValue="value"
            />
          </label>

        <template #actions>
          <PButton icon="pi pi-plus" label="Create tenant" type="submit" />
        </template>
      </FormShell>
    </AdminPanel>
  </div>

  <AdminPanel
    title="Tenant Features"
    :subtitle="selectedTenant ? `Current tenant: ${selectedTenant.displayName}` : 'Select a tenant to manage features.'"
  >
    <div v-if="selectedTenant" class="feature-grid">
        <div v-for="feature in tenantFeatures" :key="feature.key" class="feature-card">
          <div>
            <strong>{{ feature.label }}</strong>
            <p class="muted-copy">{{ feature.key }}</p>
          </div>
          <PToggleSwitch
            :modelValue="feature.enabled"
            @update:modelValue="toggleFeature(feature.key, $event)"
          />
        </div>
    </div>
    <PMessage v-else severity="secondary" variant="simple">Select a tenant to manage features.</PMessage>
  </AdminPanel>
</section>

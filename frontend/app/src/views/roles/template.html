<section class="page">
  <PageHeader
    eyebrow="Authorization"
    title="Roles"
    icon="pi pi-id-card"
    :copy="
      tenantStore.selectedTenantId
        ? `Define role templates for tenant ${tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId}.`
        : 'Select a tenant in the Tenants view before managing roles.'
    "
  />

  <div class="panel-grid">
    <AdminPanel title="Role Directory" :subtitle="isLoading ? 'Loading...' : `${roleRows.length} roles`">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <AppDataTable v-if="tenantStore.selectedTenantId" :value="roleRows" dataKey="id" :loading="isLoading">
        <PColumn field="key" header="Key" sortable />
        <PColumn field="displayName" header="Name" sortable />
        <PColumn field="description" header="Description" sortable />
        <PColumn field="permissionCount" header="Permissions" sortable />
        <PColumn header="Status" field="active" sortable>
          <template #body="{ data }">
            <StatusTag :value="data.active ? 'ACTIVE' : 'INACTIVE'" />
          </template>
        </PColumn>
        <PColumn v-if="canManageRoles" header="Actions">
          <template #body="{ data }">
            <PButton icon="pi pi-pencil" severity="secondary" variant="text" rounded @click="edit(data)" />
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel v-if="canManageRoles" :title="isEditing ? 'Update Role' : 'Create Role'" subtitle="Backed by live permission definitions from the API.">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
          <label>
            <span>Key</span>
            <PInputText v-model="form.key" type="text" :disabled="isEditing" />
          </label>

          <label>
            <span>Display name</span>
            <PInputText v-model="form.displayName" type="text" />
          </label>

          <label>
            <span>Description</span>
            <PTextarea v-model="form.description" rows="4" />
          </label>

          <label>
            <span>Role state</span>
            <div class="inline-switch">
              <PToggleSwitch v-model="form.active" />
              <span>{{ form.active ? "Role is active" : "Role is inactive" }}</span>
            </div>
          </label>

          <label>
            <span>Permissions</span>
            <PMultiSelect
              v-model="form.permissionKeys"
              :options="permissions"
              optionLabel="key"
              optionValue="key"
              filter
              display="chip"
            />
          </label>

        <template #actions>
          <PButton v-if="isEditing" label="Cancel" severity="secondary" variant="text" @click="cancelEdit" />
          <PButton :disabled="!tenantStore.selectedTenantId" :label="isEditing ? 'Update role' : 'Create role'" :icon="isEditing ? 'pi pi-check' : 'pi pi-plus'" type="submit" />
        </template>
      </FormShell>
    </AdminPanel>
  </div>
</section>

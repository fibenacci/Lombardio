<section class="page">
  <PageHeader
    eyebrow="Authorization"
    title="Roles"
    icon="pi pi-id-card"
    :copy="
      tenantStore.selectedTenantId
        ? `Review role assignments available to tenant ${tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId}.`
        : 'Select a tenant in the Tenants view before reviewing roles.'
    "
  />

  <div class="panel-grid">
    <AdminPanel title="Role Directory" :subtitle="isLoading ? 'Loading...' : `${roleRows.length} roles`">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <PMessage v-if="successMessage" severity="info" variant="simple">{{ successMessage }}</PMessage>
      <AppDataTable v-if="tenantStore.selectedTenantId" :value="roleRows" dataKey="id" :loading="isLoading">
        <PColumn field="key" header="Key" sortable />
        <PColumn field="displayName" header="Name" sortable />
        <PColumn field="description" header="Description" sortable />
        <PColumn field="permissionCount" header="Permissions" sortable />
        <PColumn header="Status" field="active" sortable>
          <template #body="{ data }">
            <StatusTag :value="data.active ? 'ACTIVE' : 'INACTIVE'" />
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel title="Role Management" subtitle="Current platform API support">
      <PMessage severity="info" variant="simple">
        This screen reflects the live tenant-accessible role catalog. Role CRUD is still not exposed by the current platform service.
      </PMessage>
      <PButton :disabled="!tenantStore.selectedTenantId || isLoading" icon="pi pi-refresh" label="Reload roles" severity="secondary" @click="reload" />
    </AdminPanel>
  </div>
</section>

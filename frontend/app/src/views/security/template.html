<section class="page">
  <PageHeader :eyebrow="t('security.eyebrow')" :title="t('security.title')" :copy="t('security.copy')" icon="pi pi-shield" />

  <div class="panel-grid">
    <PCard class="panel">
      <template #title>{{ t("security.totpStatusTitle") }}</template>
      <template #subtitle>{{ t("security.totpStatusSubtitle") }}</template>
      <template #content>
        <StatusTag :value="authStore.user?.mfaEnabled ? 'ENABLED' : 'INACTIVE'" :activeValues="['ENABLED']" />
        <PDivider />
        <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
        <PMessage v-if="successMessage" severity="success" variant="simple">{{ successMessage }}</PMessage>
        <PButton
          v-if="!authStore.user?.mfaEnabled"
          :disabled="isSubmitting"
          icon="pi pi-shield"
          :label="t('security.startSetup')"
          @click="startEnrollment"
        />
      </template>
    </PCard>

    <PCard v-if="enrollment" class="panel">
      <template #title>{{ t("security.activateTitle") }}</template>
      <template #subtitle>{{ t("security.activateSubtitle") }}</template>
      <template #content>
        <div class="stack-form">
          <label>
            <span>{{ t("security.secret") }}</span>
            <PInputText :modelValue="enrollment.secret" readonly type="text" />
            <small class="muted-copy">{{ enrollment.secret }}</small>
          </label>

          <label>
            <span>{{ t("security.otpauthUri") }}</span>
            <PTextarea :modelValue="enrollment.otpauthUri" readonly rows="4" />
          </label>

          <label>
            <span>{{ t("security.code") }}</span>
            <PInputText v-model="activationCode" type="text" inputmode="numeric" autocomplete="one-time-code" />
          </label>

          <PButton :disabled="isSubmitting" icon="pi pi-check-circle" :label="t('security.enableTotp')" @click="activate" />
        </div>
      </template>
    </PCard>

    <PCard class="panel">
      <template #title>{{ t("security.settingsTitle") }}</template>
      <template #subtitle>{{ t("security.settingsSubtitle") }}</template>
      <template #content>
        <div class="stack-form">
          <label>
            <span>{{ t("language.label") }}</span>
            <PSelect
              v-model="selectedLocale"
              :options="availableLocales.map((item) => ({ label: t(`language.${item}`), value: item }))"
              optionLabel="label"
              optionValue="value"
              @change="updateLanguage"
            />
          </label>
        </div>
      </template>
    </PCard>
  </div>
</section>

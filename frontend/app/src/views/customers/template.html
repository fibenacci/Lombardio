<section class="page">
  <PageHeader
    :eyebrow="t('customers.eyebrow')"
    :title="t('customers.title')"
    icon="pi pi-users"
    :copy="
      tenantStore.selectedTenantId
        ? t('customers.copyWithTenant', { tenant: tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId })
        : t('customers.copyWithoutTenant')
    "
  />

  <AdminPanel :title="t('customers.overviewTitle')" :subtitle="isLoading ? t('common.loading') : t('customers.count', { count: customers.length })">
      <FilterBar>
        <PInputText v-model="query" :placeholder="t('customers.searchPlaceholder')" type="text" />
        <template #actions>
        <PButton icon="pi pi-search" :label="t('common.search')" severity="secondary" outlined @click="runSearch" />
        </template>
      </FilterBar>

      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>

      <AppDataTable v-if="tenantStore.selectedTenantId" :value="customers" dataKey="id" :loading="isLoading">
        <PColumn field="customerNumber" :header="t('customers.columns.customerNumber')" sortable />
        <PColumn field="displayName" :header="t('customers.columns.name')" sortable />
        <PColumn field="phone" :header="t('customers.columns.phone')" sortable />
        <PColumn :header="t('customers.columns.kyc')" field="kycStatus" sortable>
          <template #body="{ data }">
            <StatusTag :value="getKycStatusLabel(data.kycStatus)" :activeValues="[t('customerDetail.statusOptions.kyc.APPROVED')]" :warnValues="[t('customerDetail.statusOptions.kyc.IN_PROGRESS')]" />
          </template>
        </PColumn>
        <PColumn :header="t('customers.columns.aml')" field="amlStatus" sortable>
          <template #body="{ data }">
            <div class="compliance-cell">
              <StatusTag :value="getAmlStatusLabel(data.amlStatus ?? 'UNKNOWN')" :activeValues="[t('customerDetail.statusOptions.aml.CLEAR')]" :warnValues="[t('customerDetail.statusOptions.aml.REVIEW_REQUIRED')]" />
              <small v-if="data.amlRiskLevel" class="muted-copy">{{ t("customers.risk", { level: data.amlRiskLevel }) }}</small>
              <small v-if="data.goamlReference" class="muted-copy">{{ t("customers.goamlReference", { reference: data.goamlReference }) }}</small>
            </div>
          </template>
        </PColumn>
        <PColumn :header="t('customers.columns.address')" field="city" sortable>
          <template #body="{ data }">
            {{ [data.street, data.postalCode, data.city].filter(Boolean).join(", ") || t("customers.noAddress") }}
          </template>
        </PColumn>
        <PColumn>
          <template #body="{ data }">
            <PButton icon="pi pi-arrow-right" :label="t('common.details')" severity="secondary" outlined size="small" @click="openCustomer(data.id)" />
          </template>
        </PColumn>
      </AppDataTable>
  </AdminPanel>
</section>

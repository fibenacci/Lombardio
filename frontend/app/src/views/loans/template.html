<section class="page">
  <PageHeader
    :eyebrow="t('loans.eyebrow')"
    :title="t('loans.title')"
    icon="pi pi-file-edit"
    :copy="
      tenantStore.selectedTenantId
        ? t('loans.copyWithTenant', { tenant: tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId })
        : t('loans.copyWithoutTenant')
    "
  />

  <AdminPanel :title="t('loans.registerTitle')" :subtitle="isLoading ? t('common.loading') : t('loans.count', { count: filteredLoans.length })">
    <template #actions>
      <span class="muted-copy">{{ t("loans.registerSubtitle") }}</span>
    </template>

    <FilterBar>
      <PInputText v-model="query" :placeholder="t('loans.searchPlaceholder')" type="text" />
    </FilterBar>

    <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>

    <AppDataTable v-if="tenantStore.selectedTenantId" :value="filteredLoans" dataKey="id" :loading="isLoading">
      <PColumn field="pledgeRecord.recordedAt" :header="t('loans.columns.recordedAt')" sortable />
      <PColumn :header="t('loans.columns.customer')" field="customer.displayName" sortable>
        <template #body="{ data }">
          <div>{{ data.customer.displayName }}</div>
          <small class="muted-copy">{{ data.customer.customerNumber }}</small>
        </template>
      </PColumn>
      <PColumn :header="t('loans.columns.documentType')" field="pledgeRecord.checkedDocumentType" sortable>
        <template #body="{ data }">
          {{ data.pledgeRecord.checkedDocumentType ?? t("common.notAvailable") }}
        </template>
      </PColumn>
      <PColumn :header="t('loans.columns.tickets')">
        <template #body="{ data }">
          <div v-for="ticket in data.pawnTickets" :key="ticket.ticketNumber">
            {{ ticket.ticketNumber }} · {{ ticket.totalLoanValue }} EUR
          </div>
        </template>
      </PColumn>
      <PColumn :header="t('loans.columns.powerOfAttorney')" field="pledgeRecord.powerOfAttorneyRequired" sortable>
        <template #body="{ data }">
          {{ data.pledgeRecord.powerOfAttorneyRequired ? t("common.yes") : t("common.no") }}
        </template>
      </PColumn>
      <PColumn field="pledgeRecord.retentionUntil" :header="t('loans.columns.retentionUntil')" sortable />
    </AppDataTable>
  </AdminPanel>
</section>

<div class="login-shell">
  <PCard class="login-card">
    <template #content>
      <div class="login-head">
        <h1>Lombardio</h1>
        <p>{{ t('login.welcomeMessage') }}</p>
      </div>

      <div v-if="errorMessage" class="p-error-message">
        <PMessage severity="error" :closable="false">{{ errorMessage }}</PMessage>
      </div>

      <form @submit.prevent="submit" class="login-form">
        <div class="form-field">
          <label for="username">{{ t('login.username') }}</label>
          <PInputText 
            id="username" 
            v-model="form.username" 
            :placeholder="t('login.usernamePlaceholder')"
            class="w-full"
            required
            :disabled="isSubmitting"
          />
        </div>

        <div class="form-field">
          <label for="password">{{ t('login.password') }}</label>
          <PPassword 
            id="password" 
            v-model="form.password" 
            :placeholder="t('login.passwordPlaceholder')"
            class="w-full"
            :feedback="false"
            toggle-mask
            required
            :disabled="isSubmitting"
          />
        </div>

        <div class="login-actions">
          <PButton 
            type="submit" 
            class="w-full p-button-lg"
            :label="isSubmitting ? t('login.isLoggingIn') : t('login.submit')"
            :loading="isSubmitting"
          />
        </div>
      </form>
    </template>
  </PCard>
</div>

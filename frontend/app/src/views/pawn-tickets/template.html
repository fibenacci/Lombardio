<section class="page">
  <PageHeader
    :eyebrow="t('pawnTickets.eyebrow')"
    :title="t('pawnTickets.title')"
    icon="pi pi-ticket"
    :copy="
      tenantStore.selectedTenantId
        ? t('pawnTickets.copyWithTenant', { tenant: tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId })
        : t('pawnTickets.copyWithoutTenant')
    "
  />

  <AdminPanel :title="t('pawnTickets.overviewTitle')" :subtitle="isLoading ? t('common.loading') : t('pawnTickets.count', { count: filteredTickets.length })">
    <template #actions>
      <span class="muted-copy">{{ t("pawnTickets.overviewSubtitle") }}</span>
    </template>

    <FilterBar>
      <PInputText v-model="query" :placeholder="t('pawnTickets.searchPlaceholder')" type="text" />
    </FilterBar>

    <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>

    <AppDataTable v-if="tenantStore.selectedTenantId" :value="filteredTickets" dataKey="ticketNumber" :loading="isLoading">
      <PColumn :header="t('pawnTickets.columns.contract')" field="contractNumber" sortable>
        <template #body="{ data }">
          <strong>{{ data.contractNumber }}</strong>
          <div class="muted-copy">{{ data.termsVersion }}</div>
        </template>
      </PColumn>
      <PColumn field="ticketNumber" :header="t('pawnTickets.columns.ticket')" sortable />
      <PColumn :header="t('pawnTickets.columns.customer')" field="customerDisplayName" sortable>
        <template #body="{ data }">
          <strong>{{ data.customerDisplayName }}</strong>
          <div class="muted-copy">{{ data.customerNumber }}</div>
        </template>
      </PColumn>
      <PColumn :header="t('pawnTickets.columns.createdAt')" field="createdAt" sortable>
        <template #body="{ data }">{{ data.createdAt?.slice(0, 10) }}</template>
      </PColumn>
      <PColumn field="dueDate" :header="t('pawnTickets.columns.dueDate')" sortable />
      <PColumn :header="t('pawnTickets.columns.status')" field="status" sortable>
        <template #body="{ data }">
          <StatusTag :value="data.status" :activeValues="['ACTIVE']" :warnValues="['DUE']" />
        </template>
      </PColumn>
      <PColumn :header="t('pawnTickets.columns.loan')" field="totalLoanValue" sortable>
        <template #body="{ data }">{{ data.totalLoanValue }} EUR</template>
      </PColumn>
      <PColumn :header="t('pawnTickets.columns.repayment')" field="totalRepaymentAmount" sortable>
        <template #body="{ data }">{{ data.totalRepaymentAmount }} EUR</template>
      </PColumn>
      <PColumn field="positionCount" :header="t('pawnTickets.columns.positions')" sortable />
      <PColumn :header="t('pawnTickets.columns.actions')">
        <template #body="{ data }">
          <div class="action-row">
            <PButton :disabled="isDownloading" label="PDF" severity="secondary" outlined size="small" type="button" @click="openDocument(data.ticketNumber, false)" />
            <PButton :disabled="isDownloading" :label="t('common.print')" severity="secondary" outlined size="small" type="button" @click="openDocument(data.ticketNumber, true)" />
            <PButton :disabled="isDownloading" :label="t('pawnTickets.labels')" severity="secondary" outlined size="small" type="button" @click="openLabels(data.ticketNumber, false)" />
          </div>
        </template>
      </PColumn>
    </AppDataTable>
  </AdminPanel>
</section>

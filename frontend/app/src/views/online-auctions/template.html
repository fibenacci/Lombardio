<section class="page online-auction-view">
  <PageHeader eyebrow="Live Commerce" title="Online-Auktionen" icon="pi pi-megaphone" copy="Separater Live-Bieter-Kontext mit Centrifugo-Realtime" />

  <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>

  <div class="online-auction-grid">
    <AdminPanel title="Neue Online-Auktion" subtitle="Realtime-Auktionsraum mit Bieterfreigaben und Countdown.">
      <FormShell :errorMessage="errorMessage" @submit="submitCreate">
        <label>
          <span>Titel</span>
          <PInputText v-model="createForm.title" type="text" />
        </label>
        <label>
          <span>Slug</span>
          <PInputText v-model="createForm.slug" type="text" />
        </label>
        <label>
          <span>Mindestinkrement</span>
          <PInputText v-model="createForm.minimumIncrement" type="number" min="1.00" step="0.01" />
        </label>
        <label>
          <span>Countdown in Sekunden</span>
          <PInputText v-model="createForm.countdownSeconds" type="number" min="30" step="1" />
        </label>
        <div class="lot-editor">
        <div class="lot-row header">
          <span>Los</span>
          <span>Beschreibung</span>
          <span>Startgebot</span>
        </div>
        <div v-for="(lot, index) in createForm.lots" :key="index" class="lot-row">
          <PInputText v-model="lot.title" type="text" placeholder="Los titel" />
          <PInputText v-model="lot.description" type="text" placeholder="Detailbeschreibung" />
          <PInputText v-model="lot.startingBid" type="number" min="0.01" step="0.01" />
        </div>
        </div>
        <template #actions>
          <PButton icon="pi pi-plus" label="Los hinzufuegen" severity="secondary" outlined type="button" @click="addLot" />
          <PButton icon="pi pi-save" label="Online-Auktion anlegen" type="submit" />
        </template>
      </FormShell>
    </AdminPanel>

    <AdminPanel title="Katalog" subtitle="Waehle eine Auktion fuer Freigaben und Statuswechsel.">
      <div class="auction-list">
        <button
          v-for="auction in auctions"
          :key="auction.id"
          class="auction-card"
          :class="{ selected: selectedAuctionId === auction.id }"
          type="button"
          @click="selectedAuctionId = auction.id"
        >
          <strong>{{ auction.title }}</strong>
          <span>{{ auction.status }}</span>
          <span>{{ auction.slug }}</span>
        </button>
      </div>
    </AdminPanel>
  </div>

  <AdminPanel v-if="selectedAuction" :title="selectedAuction.title" subtitle="Public URL">
    <template #actions>
      <SectionActions>
        <PButton icon="pi pi-send" label="Publizieren" severity="secondary" outlined type="button" @click="changeStatus('publish')" />
        <PButton icon="pi pi-play" label="Live starten" severity="secondary" outlined type="button" @click="changeStatus('start')" />
        <PButton icon="pi pi-stop" label="Schliessen" severity="secondary" outlined type="button" @click="changeStatus('close')" />
      </SectionActions>
    </template>

    <AdminPanel title="Oeffentliche URL">
      <p class="public-link">{{ publicUrlFor(selectedAuction) }}</p>
      <p class="hint">Bieter registrieren sich dort selbst und erhalten Paddle-Nummer, Access-Token und Realtime-Session.</p>
      <p class="hint">Mindestinkrement: {{ selectedAuction.minimumIncrement }} | Countdown: {{ selectedAuction.countdownSeconds }}s</p>
    </AdminPanel>

    <AdminPanel title="Lose">
      <AppDataTable :value="selectedAuction.lots" dataKey="id">
        <PColumn field="lotNumber" header="Los" sortable />
        <PColumn field="title" header="Titel" sortable />
        <PColumn field="startingBid" header="Start" sortable />
        <PColumn field="currentBid" header="Aktuell" sortable />
        <PColumn header="Hoechstbieter" field="highestBidderAlias" sortable>
          <template #body="{ data }">{{ data.highestBidderAlias || "-" }}</template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel title="Bieterfreigaben">
      <AppDataTable :value="selectedAuction.registrations" dataKey="id">
        <PColumn field="paddleNumber" header="Paddle" sortable />
        <PColumn field="displayName" header="Name" sortable />
        <PColumn field="email" header="E-Mail" sortable />
        <PColumn header="Status" field="approvalStatus" sortable>
          <template #body="{ data }">
            {{ data.approvalStatus }}<br />
            <small>KYC: {{ data.kycStatus }} | Konto: {{ data.accountCheckStatus }}</small>
          </template>
        </PColumn>
        <PColumn header="Aktion">
          <template #body="{ data }">
            <div class="action-stack">
              <PInputText :modelValue="data.legalName" type="text" disabled />
              <PInputText :modelValue="data.birthDate" type="text" disabled />
              <PInputText :modelValue="data.ibanMasked" type="text" disabled />
              <PSelect
                v-model="reviewForms[data.id].kycStatus"
                :options="[
                  { label: 'KYC pending', value: 'PENDING' },
                  { label: 'KYC passed', value: 'PASSED' },
                  { label: 'KYC failed', value: 'FAILED' }
                ]"
                optionLabel="label"
                optionValue="value"
              />
              <PSelect
                v-model="reviewForms[data.id].accountCheckStatus"
                :options="[
                  { label: 'Konto pending', value: 'PENDING' },
                  { label: 'Konto passed', value: 'PASSED' },
                  { label: 'Konto failed', value: 'FAILED' }
                ]"
                optionLabel="label"
                optionValue="value"
              />
              <PInputText v-model="reviewForms[data.id].reviewNote" type="text" placeholder="Review-Notiz" />
              <SectionActions>
                <PButton label="Freigeben" severity="secondary" outlined size="small" type="button" @click="reviewRegistration(data.id, 'APPROVE')" />
                <PButton label="Ablehnen" severity="secondary" outlined size="small" type="button" @click="reviewRegistration(data.id, 'REJECT')" />
              </SectionActions>
            </div>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>
  </AdminPanel>
</section>

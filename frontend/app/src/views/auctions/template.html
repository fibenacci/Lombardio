<section class="page auction-view">
  <PageHeader eyebrow="Verwertung" title="Auktionen und Ueberschuesse" icon="pi pi-gavel" copy="Backoffice-Versteigerung ohne Echtzeit-Bieterkanal" />

  <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>

  <div class="auction-grid">
    <AdminPanel title="Neue Auktion" subtitle="Erfasse Auktion und Lose aus dem stationaeren Verwertungsprozess.">
      <FormShell :errorMessage="errorMessage" @submit="submitCreate">
        <label>
          <span>Titel</span>
          <PInputText v-model="createForm.title" type="text" />
        </label>
        <label>
          <span>Ort</span>
          <PInputText v-model="createForm.location" type="text" />
        </label>

        <div class="lot-editor">
        <div class="lot-row header">
          <span>Vertrag</span>
          <span>Pfandnummer</span>
          <span>Beschreibung</span>
          <span>Schaetzwert</span>
          <span>Forderung</span>
        </div>
        <div v-for="(lot, index) in createForm.lots" :key="index" class="lot-row">
          <PInputText v-model="lot.contractNumber" type="text" placeholder="PS-5001" />
          <PInputText v-model="lot.itemNumber" type="text" placeholder="PS-5001-01" />
          <PInputText v-model="lot.description" type="text" placeholder="Goldring 585" />
          <PInputText v-model="lot.estimatedValue" type="number" min="0.01" step="0.01" />
          <PInputText v-model="lot.outstandingClaim" type="number" min="0.01" step="0.01" />
        </div>
        </div>

        <template #actions>
          <PButton icon="pi pi-plus" label="Los hinzufuegen" severity="secondary" outlined type="button" @click="addLot" />
          <PButton icon="pi pi-save" label="Auktion anlegen" type="submit" />
        </template>
      </FormShell>
    </AdminPanel>

    <AdminPanel title="Versteigerungen" subtitle="Waehle eine Auktion fuer Bekanntmachung und Zuschlag.">
      <div class="auction-list">
        <button
          v-for="auction in auctions"
          :key="auction.id"
          class="auction-card"
          :class="{ selected: selectedAuctionId === auction.id }"
          type="button"
          @click="selectedAuctionId = auction.id"
        >
          <strong>{{ auction.title }}</strong>
          <span>{{ auction.status }}</span>
          <span>{{ auction.location }}</span>
          <span v-if="auction.auctionDate">Termin: {{ auction.auctionDate }}</span>
        </button>
      </div>
    </AdminPanel>
  </div>

  <AdminPanel v-if="selectedAuction" :title="selectedAuction.title" subtitle="Ausgewaehlte Auktion">
    <template #actions>
      <SectionActions>
        <PButton icon="pi pi-play" label="Live starten" severity="secondary" outlined type="button" @click="triggerOpen" />
        <PButton icon="pi pi-stop" label="Auktion schliessen" severity="secondary" outlined type="button" @click="triggerClose" />
      </SectionActions>
    </template>

    <AdminPanel title="Bekanntmachung" subtitle="Oeffentliche Bekanntmachung mindestens 1 Woche und hoechstens 2 Wochen vor Termin.">
      <label>
        <span>Auktionstermin</span>
        <PInputText v-model="announceForm.auctionDate" type="date" />
      </label>
      <label>
        <span>Bekanntmachungsreferenz</span>
        <PInputText v-model="announceForm.announcementReference" type="text" placeholder="Amtsblatt 12/2026" />
      </label>
      <SectionActions>
        <PButton icon="pi pi-save" label="Bekanntmachung speichern" type="button" @click="submitAnnouncement" />
      </SectionActions>
    </AdminPanel>

    <AdminPanel title="Lose">
      <AppDataTable :value="selectedAuction.lots" dataKey="id">
        <PColumn field="lotNumber" header="Los" sortable />
        <PColumn field="contractNumber" header="Vertrag" sortable />
        <PColumn field="description" header="Beschreibung" sortable />
        <PColumn header="Aktuelles Gebot" field="latestBidAmount" sortable>
          <template #body="{ data }">{{ data.latestBidAmount || "0.00" }}</template>
        </PColumn>
        <PColumn header="Zuschlag" field="hammerPrice" sortable>
          <template #body="{ data }">{{ data.hammerPrice || "-" }}</template>
        </PColumn>
        <PColumn header="Ueberschuss" field="surplusAmount" sortable>
          <template #body="{ data }">{{ data.surplusAmount || "-" }}</template>
        </PColumn>
        <PColumn header="Aktionen">
          <template #body="{ data }">
            <div class="action-stack">
              <PInputText v-model="bidForms[data.id].bidderDisplayName" type="text" placeholder="Bietername" />
              <PInputText v-model="bidForms[data.id].amount" type="number" min="0.01" step="0.01" placeholder="Gebot" />
              <PButton label="Gebot" severity="secondary" outlined size="small" type="button" @click="submitBid(data.id)" />
              <PInputText v-model="settleForms[data.id].hammerPrice" type="number" min="0.01" step="0.01" placeholder="Zuschlag" />
              <PButton label="Zuschlag buchen" severity="secondary" outlined size="small" type="button" @click="submitSettlement(data.id)" />
            </div>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>
  </AdminPanel>

  <AdminPanel title="Ueberschussfaelle">
    <AppDataTable :value="surplusCases" dataKey="lotId">
      <PColumn field="lotNumber" header="Los" sortable />
      <PColumn field="contractNumber" header="Vertrag" sortable />
      <PColumn field="hammerPrice" header="Zuschlag" sortable />
      <PColumn field="outstandingClaim" header="Forderung" sortable />
      <PColumn field="surplusAmount" header="Ueberschuss" sortable />
      <PColumn field="authorityTransferDueDate" header="Behoerdenfrist" sortable />
      <PColumn field="authorityTransferStatus" header="Status" sortable />
    </AppDataTable>
  </AdminPanel>
</section>

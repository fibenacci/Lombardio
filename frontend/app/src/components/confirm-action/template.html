<span class="confirm-action">
  <PButton :icon="icon" :label="label" :severity="severity" :outlined="outlined" :size="size" type="button" @click="open" />

  <PDialog v-model:visible="isOpen" modal :header="header" :style="{ width: '28rem', maxWidth: 'calc(100vw - 2rem)' }">
    <p class="muted-copy">{{ message }}</p>

    <template #footer>
      <SectionActions>
        <PButton :label="cancelLabel" severity="secondary" outlined type="button" @click="close" />
        <PButton :label="confirmLabel" type="button" @click="confirm" />
      </SectionActions>
    </template>
  </PDialog>
</span>

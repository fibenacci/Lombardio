<PToolbar class="page-toolbar page-header-toolbar">
  <template #start>
    <div class="page-header-main">
      <div class="page-header-icon">
        <i :class="icon"></i>
      </div>
      <div>
        <p class="eyebrow">{{ eyebrow }}</p>
        <h2>{{ title }}</h2>
      </div>
    </div>
  </template>
  <template #end>
    <p class="page-copy">{{ copy }}</p>
  </template>
</PToolbar>

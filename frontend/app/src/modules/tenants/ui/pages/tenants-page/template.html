<section class="page">
  <PageHeader
    :eyebrow="t('tenants.eyebrow')"
    :title="t('tenants.title')"
    icon="pi pi-building"
    :copy="t('tenants.copy')"
  />

  <div class="panel-grid">
    <AdminPanel :title="t('tenants.directoryTitle')" :subtitle="isLoading ? t('common.loading') : t('tenants.count', { count: tenants.length })">
      <template #actions>
        <PTag v-if="selectedTenant" severity="info" :value="selectedTenant.displayName" />
      </template>

      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <AppDataTable :value="tenants" dataKey="id" :loading="isLoading">
        <PColumn field="displayName" :header="t('tenants.columns.tenant')" sortable>
          <template #body="{ data }">
            <button
              :class="['tenant-row-action', { active: tenantStore.selectedTenantId === data.id }]"
              type="button"
              @click="selectTenant(data.id)"
            >
              <span class="tenant-row-main">
                <strong>{{ data.displayName }}</strong>
                <span class="muted-copy">{{ data.key }}</span>
              </span>
              <PTag :severity="tenantStatusSeverity(data.status)" :value="t(`tenants.status.${data.status}`)" />
            </button>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel :title="t('tenants.createTitle')" :subtitle="t('tenants.createSubtitle')">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
          <label>
            <span>{{ t("tenants.fields.key") }}</span>
            <PInputText v-model="form.key" type="text" />
          </label>

          <label>
            <span>{{ t("tenants.fields.displayName") }}</span>
            <PInputText v-model="form.displayName" type="text" />
          </label>

          <label>
            <span>{{ t("tenants.fields.status") }}</span>
            <PSelect
              v-model="form.status"
              :options="statusOptions"
              optionLabel="label"
              optionValue="value"
            />
          </label>

        <template #actions>
          <PButton icon="pi pi-plus" :label="t('tenants.actions.create')" type="submit" />
        </template>
      </FormShell>
    </AdminPanel>
  </div>

  <AdminPanel
    :title="t('tenants.features.title')"
    :subtitle="selectedTenant ? t('tenants.features.currentTenant', { tenant: selectedTenant.displayName }) : t('tenants.features.selectTenant')"
  >
    <div v-if="selectedTenant" class="feature-grid">
        <div v-for="feature in tenantFeatures" :key="feature.key" class="feature-card">
          <div>
            <strong>{{ feature.label }}</strong>
            <p class="muted-copy">{{ feature.description }}</p>
          </div>
          <PToggleSwitch
            :modelValue="feature.enabled"
            @update:modelValue="toggleFeature(feature.key, $event)"
          />
        </div>
    </div>
    <PMessage v-else severity="secondary" variant="simple">{{ t("tenants.features.selectTenant") }}</PMessage>
  </AdminPanel>
</section>

<section class="page">
  <PageHeader
    :eyebrow="t('roles.eyebrow')"
    :title="t('roles.title')"
    icon="pi pi-id-card"
    :copy="
      tenantStore.selectedTenantId
        ? t('roles.copyWithTenant', { tenant: tenantStore.selectedTenant?.displayName ?? tenantStore.selectedTenantId })
        : t('roles.copyWithoutTenant')
    "
  />

  <div class="panel-grid">
    <AdminPanel :title="t('roles.directoryTitle')" :subtitle="isLoading ? t('common.loading') : t('roles.count', { count: roleRows.length })">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <PMessage v-if="successMessage" severity="info" variant="simple">{{ successMessage }}</PMessage>
      <AppDataTable v-if="tenantStore.selectedTenantId" :value="roleRows" dataKey="id" :loading="isLoading">
        <PColumn field="key" :header="t('roles.columns.key')" sortable />
        <PColumn field="displayName" :header="t('roles.columns.name')" sortable />
        <PColumn field="description" :header="t('roles.columns.description')" sortable />
        <PColumn field="permissionCount" :header="t('roles.columns.permissions')" sortable />
        <PColumn :header="t('roles.columns.status')" field="active" sortable>
          <template #body="{ data }">
            <StatusTag :value="t(data.active ? 'roles.status.ACTIVE' : 'roles.status.INACTIVE')" />
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel :title="t('roles.managementTitle')" :subtitle="t('roles.managementSubtitle')">
      <PMessage severity="info" variant="simple">
        {{ t("roles.managementCopy") }}
      </PMessage>
      <PButton :disabled="!tenantStore.selectedTenantId || isLoading" icon="pi pi-refresh" :label="t('roles.actions.reload')" severity="secondary" @click="reload" />
    </AdminPanel>
  </div>
</section>

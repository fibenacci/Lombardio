<section class="page">
  <PageHeader
    :eyebrow="t('users.eyebrow')"
    :title="t('users.title')"
    icon="pi pi-users"
    :copy="pageCopy"
  />

  <div class="panel-grid">
    <AdminPanel :title="t('users.directoryTitle')" :subtitle="isLoading ? t('common.loading') : t('users.count', { count: userRows.length })">
      <PMessage v-if="errorMessage" severity="error" variant="simple">{{ errorMessage }}</PMessage>
      <PMessage v-if="successMessage" severity="info" variant="simple">{{ successMessage }}</PMessage>
      <AppDataTable v-if="tenantStore.selectedTenantId" :value="userRows" dataKey="id" :loading="isLoading">
        <PColumn field="username" :header="t('users.columns.username')" sortable />
        <PColumn field="email" :header="t('users.columns.email')" sortable />
        <PColumn field="displayName" :header="t('users.columns.displayName')" sortable />
        <PColumn :header="t('users.columns.status')" field="status" sortable>
          <template #body="{ data }">
            <StatusTag :value="t(`users.status.${data.status}`)" />
          </template>
        </PColumn>
        <PColumn field="branchCount" :header="t('users.columns.branches')" sortable />
        <PColumn field="roleNames" :header="t('users.columns.roles')" sortable />
        <PColumn :header="t('users.columns.actions')">
          <template #body="{ data }">
            <div class="table-actions">
              <PButton
                v-if="canManageUsers"
                icon="pi pi-pencil"
                severity="secondary"
                variant="text"
                rounded
                @click="startEdit(data)"
              />
              <ConfirmAction
                v-if="canDelegateToUser(data)"
                icon="pi pi-user-plus"
                label=""
                severity="secondary"
                variant="text"
                rounded
                :header="t('users.delegation.header')"
                :message="t('users.delegation.message', { user: data.displayName || data.username })"
                :confirmLabel="t('users.delegation.confirm')"
                @confirm="delegateToUser(data.id)"
              />
            </div>
          </template>
        </PColumn>
      </AppDataTable>
    </AdminPanel>

    <AdminPanel v-if="canManageUsers" :title="editingUserId ? t('users.form.editTitle') : t('users.form.createTitle')" :subtitle="t('users.form.subtitle')">
      <FormShell :errorMessage="errorMessage" :successMessage="successMessage" @submit="submit">
          <label>
            <span>{{ t("users.fields.username") }}</span>
            <PInputText v-model="form.username" type="text" />
          </label>

          <label>
            <span>{{ t("users.fields.email") }}</span>
            <PInputText v-model="form.email" type="email" />
          </label>

          <label v-if="!editingUserId">
            <span>{{ t("users.fields.initialPassword") }}</span>
            <PPassword v-model="form.initialPassword" :feedback="false" toggleMask fluid />
          </label>

          <label>
            <span>{{ t("users.fields.displayName") }}</span>
            <PInputText v-model="form.displayName" type="text" />
          </label>

          <label>
            <span>{{ t("users.fields.status") }}</span>
            <PSelect
              v-model="form.status"
              :options="statusOptions"
              optionLabel="label"
              optionValue="value"
            />
          </label>

          <label>
            <span>{{ t("users.fields.roleIds") }}</span>
            <PMultiSelect v-model="form.roleIds" :options="roleOptions" optionLabel="label" optionValue="value" display="chip" />
          </label>

          <label>
            <span>{{ t("users.fields.branchIds") }}</span>
            <PMultiSelect v-model="form.branchIds" :options="branchOptions" optionLabel="label" optionValue="value" display="chip" />
          </label>

        <template #actions>
          <SectionActions>
            <PButton :disabled="!tenantStore.selectedTenantId" :label="editingUserId ? t('users.actions.save') : t('users.actions.create')" icon="pi pi-save" type="submit" />
            <PButton v-if="editingUserId" icon="pi pi-times" :label="t('users.actions.cancel')" severity="secondary" outlined type="button" @click="resetForm" />
          </SectionActions>
        </template>
      </FormShell>
    </AdminPanel>
  </div>
</section>

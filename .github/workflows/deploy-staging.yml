name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy to staging
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/lombardio
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - uses: imranismail/setup-kustomize@v2
      - uses: azure/setup-kubectl@v5
      - name: Terraform init Hetzner staging cluster
        working-directory: infra/terraform/environments/hcloud-cluster
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN_STAGING }}
          TF_VAR_cluster_name: ${{ secrets.HCLOUD_CLUSTER_NAME_STAGING || 'lombardio-staging' }}
          TF_VAR_location: ${{ secrets.HCLOUD_LOCATION_STAGING || 'nbg1' }}
          TF_VAR_control_plane_type: ${{ secrets.HCLOUD_CONTROL_PLANE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_worker_node_type: ${{ secrets.HCLOUD_WORKER_NODE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_ssh_public_key: ${{ secrets.HCLOUD_SSH_PUBLIC_KEY_STAGING }}
          TF_VAR_ssh_private_key: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY_STAGING }}
        run: terraform init
      - name: Terraform apply Hetzner staging cluster
        working-directory: infra/terraform/environments/hcloud-cluster
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN_STAGING }}
          TF_VAR_cluster_name: ${{ secrets.HCLOUD_CLUSTER_NAME_STAGING || 'lombardio-staging' }}
          TF_VAR_location: ${{ secrets.HCLOUD_LOCATION_STAGING || 'nbg1' }}
          TF_VAR_control_plane_type: ${{ secrets.HCLOUD_CONTROL_PLANE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_worker_node_type: ${{ secrets.HCLOUD_WORKER_NODE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_ssh_public_key: ${{ secrets.HCLOUD_SSH_PUBLIC_KEY_STAGING }}
          TF_VAR_ssh_private_key: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY_STAGING }}
        run: terraform apply -auto-approve
      - name: Export kubeconfig from Hetzner staging cluster
        id: kubeconfig
        working-directory: infra/terraform/environments/hcloud-cluster
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN_STAGING }}
          TF_VAR_cluster_name: ${{ secrets.HCLOUD_CLUSTER_NAME_STAGING || 'lombardio-staging' }}
          TF_VAR_location: ${{ secrets.HCLOUD_LOCATION_STAGING || 'nbg1' }}
          TF_VAR_control_plane_type: ${{ secrets.HCLOUD_CONTROL_PLANE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_worker_node_type: ${{ secrets.HCLOUD_WORKER_NODE_TYPE_STAGING || 'cpx22' }}
          TF_VAR_ssh_public_key: ${{ secrets.HCLOUD_SSH_PUBLIC_KEY_STAGING }}
          TF_VAR_ssh_private_key: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY_STAGING }}
        run: |
          mkdir -p ~/.kube
          terraform output -raw kubeconfig > ~/.kube/config
          echo "context=$(kubectl config current-context)" >> "$GITHUB_OUTPUT"
      - name: Terraform init staging foundations
        working-directory: infra/terraform/environments/staging
        env:
          TF_VAR_kubeconfig_context: ${{ steps.kubeconfig.outputs.context }}
          TF_VAR_cluster_issuer_email: ${{ secrets.ACME_EMAIL_STAGING }}
          TF_VAR_enable_cluster_issuer: ${{ secrets.TF_ENABLE_CLUSTER_ISSUER_STAGING || 'true' }}
          TF_VAR_enable_vault_cluster_secret_store: ${{ secrets.TF_ENABLE_VAULT_CLUSTER_SECRET_STORE_STAGING || 'true' }}
          TF_VAR_vault_server: ${{ secrets.VAULT_SERVER_STAGING }}
          TF_VAR_vault_role: ${{ secrets.VAULT_ROLE_STAGING }}
          TF_VAR_vault_token: ${{ secrets.VAULT_TOKEN_STAGING }}
          TF_VAR_base_domain: ${{ secrets.BASE_DOMAIN_STAGING || 'staging.lombardio.example' }}
        run: terraform init
      - name: Terraform apply staging foundations
        working-directory: infra/terraform/environments/staging
        env:
          TF_VAR_kubeconfig_context: ${{ steps.kubeconfig.outputs.context }}
          TF_VAR_cluster_issuer_email: ${{ secrets.ACME_EMAIL_STAGING }}
          TF_VAR_enable_cluster_issuer: ${{ secrets.TF_ENABLE_CLUSTER_ISSUER_STAGING || 'true' }}
          TF_VAR_enable_vault_cluster_secret_store: ${{ secrets.TF_ENABLE_VAULT_CLUSTER_SECRET_STORE_STAGING || 'true' }}
          TF_VAR_vault_server: ${{ secrets.VAULT_SERVER_STAGING }}
          TF_VAR_vault_role: ${{ secrets.VAULT_ROLE_STAGING }}
          TF_VAR_vault_token: ${{ secrets.VAULT_TOKEN_STAGING }}
          TF_VAR_base_domain: ${{ secrets.BASE_DOMAIN_STAGING || 'staging.lombardio.example' }}
        run: terraform apply -auto-approve
      - name: Resolve image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set images
        run: |
          cd infra/k8/overlays/staging
          kustomize edit set image ghcr.io/example/lombardio/identity-access:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/identity-access:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/platform:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/platform:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/customer:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/customer:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/loan-origination:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/loan-origination:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/pawn-ticket:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pawn-ticket:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/kyc:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kyc:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/aml:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/aml:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/auction:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auction:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/online-auction:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/online-auction:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/document-ocr:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/document-ocr:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/reporting:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reporting:${{ steps.meta.outputs.tag }}
          kustomize edit set image ghcr.io/example/lombardio/frontend:latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.meta.outputs.tag }}
      - name: Deploy staging
        run: kubectl apply -k infra/k8/overlays/staging

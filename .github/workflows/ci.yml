name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/lombardio
  BUILD_BASE_IMAGE: maven:3.9.9-eclipse-temurin-21

jobs:
  test-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-intelligence
          - platform
          - loan-origination
          - pawn-ticket
          - auction
          - online-auction
          - reporting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test ${{ matrix.service }}
        run: mvn -q test
        working-directory: services/${{ matrix.service }}

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/integration/go.sum
      - name: Test Integration Service
        run: go test ./...
        working-directory: services/integration

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm install
        working-directory: frontend/app
      - run: npm test -- --run
        working-directory: frontend/app

  build-and-push:
    if: github.event_name == 'push'
    needs:
      - test-java
      - test-go
      - test-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-intelligence
            context: .
            dockerfile: services/identity-intelligence/build/package/Dockerfile
          - name: platform
            context: .
            dockerfile: services/platform/build/package/Dockerfile
          - name: loan-origination
            context: .
            dockerfile: services/loan-origination/build/package/Dockerfile
          - name: pawn-ticket
            context: .
            dockerfile: services/pawn-ticket/build/package/Dockerfile
          - name: auction
            context: .
            dockerfile: services/auction/build/package/Dockerfile
          - name: online-auction
            context: .
            dockerfile: services/online-auction/build/package/Dockerfile
          - name: reporting
            context: .
            dockerfile: services/reporting/build/package/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/app/build/package/Dockerfile
          - name: integration
            context: .
            dockerfile: services/integration/build/package/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            DEV_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/lombardio
  BUILD_BASE_IMAGE: maven:3.9.9-eclipse-temurin-21

jobs:
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test all Java services
        run: ./mvnw clean test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/integration/go.sum
      - name: Test Integration Service
        run: go test ./...
        working-directory: services/integration

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm install
        working-directory: frontend/app
      - name: Lint
        run: npm run lint
        working-directory: frontend/app
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend/app
      - name: Test
        run: npm test -- --run
        working-directory: frontend/app

  static-analysis-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Static Analysis (SpotBugs)
        run: ./mvnw compile spotbugs:check

  build-and-push:
    if: github.event_name == 'push'
    needs:
      - test-java
      - test-go
      - test-frontend
      - static-analysis-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-intelligence
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: platform
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: loan-origination
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: pawn-ticket
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: auction
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: online-auction
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: reporting
            context: .
            dockerfile: infra/docker/JavaService.Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/app/build/package/Dockerfile
          - name: integration
            context: .
            dockerfile: services/integration/build/package/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            DEV_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            SERVICE_NAME=${{ matrix.name }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/lombardio
  BUILD_BASE_IMAGE: maven:3.9.9-eclipse-temurin-21

jobs:
  test-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-access
          - platform
          - customer
          - loan-origination
          - pawn-ticket
          - kyc
          - aml
          - auction
          - online-auction
          - reporting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test ${{ matrix.service }}
        run: mvn -q test
        working-directory: services/${{ matrix.service }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm install
        working-directory: frontend/app
      - run: npm test -- --run
        working-directory: frontend/app

  test-document-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/document-ocr/requirements.txt
      - run: pip install -r services/document-ocr/requirements.txt pytest
      - run: pytest -q
        working-directory: services/document-ocr

  build-and-push:
    if: github.event_name == 'push'
    needs:
      - test-java
      - test-frontend
      - test-document-ocr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-access
            context: .
            dockerfile: services/identity-access/build/package/Dockerfile
          - name: platform
            context: .
            dockerfile: services/platform/build/package/Dockerfile
          - name: customer
            context: .
            dockerfile: services/customer/build/package/Dockerfile
          - name: loan-origination
            context: .
            dockerfile: services/loan-origination/build/package/Dockerfile
          - name: pawn-ticket
            context: .
            dockerfile: services/pawn-ticket/build/package/Dockerfile
          - name: kyc
            context: .
            dockerfile: services/kyc/build/package/Dockerfile
          - name: aml
            context: .
            dockerfile: services/aml/build/package/Dockerfile
          - name: auction
            context: .
            dockerfile: services/auction/build/package/Dockerfile
          - name: online-auction
            context: .
            dockerfile: services/online-auction/build/package/Dockerfile
          - name: reporting
            context: .
            dockerfile: services/reporting/build/package/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/app/build/package/Dockerfile
          - name: document-ocr
            context: .
            dockerfile: services/document-ocr/build/package/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            DEV_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}

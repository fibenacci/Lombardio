global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: lombardio-spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-access:8081
          - platform:8082
          - loan-origination:8083
          - customer:8084
          - pawn-ticket:8085
          - kyc:8086
          - aml:8088
          - auction:8089
          - online-auction:8090
          - reporting:8091

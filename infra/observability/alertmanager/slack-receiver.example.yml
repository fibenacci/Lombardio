route:
  routes:
    - matchers:
        - severity="critical"
      receiver: slack-critical

receivers:
  - name: slack-critical
    slack_configs:
      - api_url: https://hooks.slack.com/services/replace/me
        channel: '#alerts'
        send_resolved: true
        title: '[{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts -}}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

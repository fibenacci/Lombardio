kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lombardio-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      - containerPort: 30082
        hostPort: 8082
        protocol: TCP
      - containerPort: 30083
        hostPort: 8083
        protocol: TCP
      - containerPort: 30084
        hostPort: 8084
        protocol: TCP
      - containerPort: 30085
        hostPort: 8085
        protocol: TCP
      - containerPort: 30089
        hostPort: 8089
        protocol: TCP
      - containerPort: 30090
        hostPort: 8090
        protocol: TCP
      - containerPort: 30091
        hostPort: 8091
        protocol: TCP
      - containerPort: 30092
        hostPort: 8092
        protocol: TCP

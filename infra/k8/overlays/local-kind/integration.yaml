apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-config
  namespace: lombardio
data:
  PORT: "8092"
  RABBITMQ_URL: amqp://lombardio:lombardio@rabbitmq:5672/
  RABBITMQ_EXCHANGE: lombardio.domain
  RABBITMQ_QUEUE: lombardio.integration
  RABBITMQ_BINDING_KEY: "#"
  INTEGRATION_EMAIL_DELIVERY_MODE: log
  INTEGRATION_WEBHOOK_DESTINATIONS: "[]"
---
apiVersion: v1
kind: Secret
metadata:
  name: integration-secret
  namespace: lombardio
type: Opaque
stringData:
  INTEGRATION_INTERNAL_SERVICE_TOKEN: local-customer-internal-token
---
apiVersion: v1
kind: Service
metadata:
  name: integration
  namespace: lombardio
spec:
  type: ClusterIP
  selector:
    app: integration
  ports:
    - name: http
      port: 8092
      targetPort: 8092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration
  namespace: lombardio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration
  template:
    metadata:
      labels:
        app: integration
    spec:
      containers:
        - name: integration
          image: lombardio-integration:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: integration-config
            - secretRef:
                name: integration-secret
          ports:
            - containerPort: 8092
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lombardio

resources:
  - ../../base
  - rabbitmq.yaml
  - keycloak.yaml
  - local-secrets.yaml
  - headlamp.yaml
  - integration.yaml

configMapGenerator:
  - name: keycloak-realm-import
    files:
      - lombardio-realm.json=../../../keycloak/lombardio-realm.json

generatorOptions:
  disableNameSuffixHash: true

patches:

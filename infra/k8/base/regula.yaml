apiVersion: v1
kind: Service
metadata:
  name: regula
spec:
  selector:
    app: regula
  ports:
    - name: http
      port: 8087
      targetPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regula
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regula
  template:
    metadata:
      labels:
        app: regula
    spec:
      containers:
        - name: regula
          image: ghcr.io/example/lombardio/regula:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-origination-config
data:
  LOAN_ORIGINATION_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity?currentSchema=loan_origination
  LOAN_ORIGINATION_DB_USERNAME: lombardio
  CUSTOMER_BASE_URL: http://customer:8084
  PAWN_TICKET_BASE_URL: http://pawn-ticket:8085
  KYC_BASE_URL: http://kyc:8086
  AML_BASE_URL: http://aml:8088
---
apiVersion: v1
kind: Service
metadata:
  name: loan-origination
spec:
  selector:
    app: loan-origination
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-origination
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-origination
  template:
    metadata:
      labels:
        app: loan-origination
    spec:
      containers:
        - name: loan-origination
          image: ghcr.io/example/lombardio/loan-origination:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          envFrom:
            - configMapRef:
                name: loan-origination-config
            - secretRef:
                name: loan-origination-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-access-config
data:
  IDENTITY_ACCESS_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity
  IDENTITY_ACCESS_DB_USERNAME: lombardio
---
apiVersion: v1
kind: Secret
metadata:
  name: identity-access-secret
type: Opaque
stringData:
  IDENTITY_ACCESS_DB_PASSWORD: change-me
  IDENTITY_SECURITY_ENCRYPTION_KEY: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: identity-access
spec:
  selector:
    app: identity-access
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-access
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-access
  template:
    metadata:
      labels:
        app: identity-access
    spec:
      containers:
        - name: identity-access
          image: ghcr.io/example/lombardio/identity-access:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: identity-access-config
            - secretRef:
                name: identity-access-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

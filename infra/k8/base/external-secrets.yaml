apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: centrifugo-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: centrifugo-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        config.json: |
          {
            "client": {
              "allowed_origins": ["*"]
            },
            "api_key": "{{ .CENTRIFUGO_API_KEY }}",
            "token_hmac_secret_key": "{{ .CENTRIFUGO_HMAC_SECRET }}",
            "engine": "redis",
            "redis_address": "redis:6379"
          }
  data:
    - secretKey: CENTRIFUGO_API_KEY
      remoteRef:
        key: lombardio/online-auction
        property: CENTRIFUGO_API_KEY
    - secretKey: CENTRIFUGO_HMAC_SECRET
      remoteRef:
        key: lombardio/online-auction
        property: CENTRIFUGO_HMAC_SECRET
---

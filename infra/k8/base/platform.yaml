apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity
  PLATFORM_DB_USERNAME: lombardio
  KEYCLOAK_OPERATOR_CLIENT_ID: lombardio-app
  APP_OPERATOR_SESSION_COOKIE_NAME: lombardio_operator_session
  APP_OPERATOR_SESSION_COOKIE_PATH: /
  APP_OPERATOR_SESSION_COOKIE_SAME_SITE: Lax
  APP_OPERATOR_SESSION_COOKIE_MAX_AGE_SECONDS: "2592000"
  APP_OPERATOR_SESSION_COOKIE_SECURE: "false"
--- 
apiVersion: v1
kind: Service
metadata:
  name: platform
spec:
  selector:
    app: platform
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      containers:
        - name: platform
          image: ghcr.io/example/lombardio/platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

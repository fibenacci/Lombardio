apiVersion: v1
kind: ConfigMap
metadata:
  name: aml-config
data:
  AML_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity?currentSchema=aml
  AML_DB_USERNAME: lombardio
  IDENTITY_ACCESS_BASE_URL: http://identity-access:8081
  PLATFORM_BASE_URL: http://platform:8082
apiVersion: v1
kind: Service
metadata:
  name: aml
spec:
  selector:
    app: aml
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aml
  template:
    metadata:
      labels:
        app: aml
    spec:
      containers:
        - name: aml
          image: ghcr.io/example/lombardio/aml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: aml-config
            - secretRef:
                name: aml-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

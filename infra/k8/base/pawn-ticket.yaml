apiVersion: v1
kind: ConfigMap
metadata:
  name: pawn-ticket-config
data:
  PAWN_TICKET_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity?currentSchema=pawn_ticket
  PAWN_TICKET_DB_USERNAME: lombardio
apiVersion: v1
kind: Service
metadata:
  name: pawn-ticket
spec:
  selector:
    app: pawn-ticket
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pawn-ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pawn-ticket
  template:
    metadata:
      labels:
        app: pawn-ticket
    spec:
      containers:
        - name: pawn-ticket
          image: ghcr.io/example/lombardio/pawn-ticket:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: pawn-ticket-config
            - secretRef:
                name: pawn-ticket-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

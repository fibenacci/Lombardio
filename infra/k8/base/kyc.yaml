apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-config
data:
  KYC_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity?currentSchema=kyc
  KYC_DB_USERNAME: lombardio
  IDENTITY_ACCESS_BASE_URL: http://identity-access:8081
  PLATFORM_BASE_URL: http://platform:8082
  DOCUMENT_OCR_BASE_URL: http://document-ocr:8087
apiVersion: v1
kind: Service
metadata:
  name: kyc
spec:
  selector:
    app: kyc
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc
  template:
    metadata:
      labels:
        app: kyc
    spec:
      containers:
        - name: kyc
          image: ghcr.io/example/lombardio/kyc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: kyc-config
            - secretRef:
                name: kyc-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

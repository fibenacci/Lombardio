apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-config
data:
  CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/lombardio_identity?currentSchema=customer
  CUSTOMER_DB_USERNAME: lombardio
  KYC_BASE_URL: http://kyc:8086
  CUSTOMER_PORTAL_SESSION_COOKIE_NAME: lombardio_customer_portal_session
  CUSTOMER_PORTAL_SESSION_COOKIE_PATH: /
  CUSTOMER_PORTAL_SESSION_COOKIE_SAME_SITE: Lax
  CUSTOMER_PORTAL_SESSION_COOKIE_MAX_AGE_SECONDS: "2592000"
  CUSTOMER_PORTAL_SESSION_TTL_SECONDS: "2592000"
  CUSTOMER_PORTAL_SESSION_CLEANUP_FIXED_DELAY_MS: "3600000"
  CUSTOMER_PORTAL_SESSION_COOKIE_SECURE: "false"
--- 
apiVersion: v1
kind: Service
metadata:
  name: customer
spec:
  selector:
    app: customer
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: ghcr.io/example/lombardio/customer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          envFrom:
            - configMapRef:
                name: customer-config
            - secretRef:
                name: customer-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

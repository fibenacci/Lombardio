apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
      - job_name: platform
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - platform:8082
      - job_name: customer
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - customer:8084
      - job_name: pawn-ticket
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - pawn-ticket:8085
      - job_name: kyc
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - kyc:8086
      - job_name: aml
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - aml:8088
      - job_name: loan-origination
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - loan-origination:8083
      - job_name: auction
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - auction:8089
      - job_name: online-auction
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - online-auction:8090
      - job_name: reporting
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - reporting:8091
  alerts.yml: |
    groups:
        rules:
          - alert: IdentityAccessHigh5xxRate
            expr: |
              (
                /
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Identity Access has elevated 5xx errors
          - alert: IdentityAccessUnauthorizedSpike
            expr: |
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Identity Access sees an elevated unauthorized rate
      - name: lombardio-loan-origination
        rules:
          - alert: LoanOriginationHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (rate(http_server_requests_seconds_bucket{application="loan-origination"}[5m]))
              ) > 1.5
            for: 10m
            labels:
              severity: warning
              service: loan-origination
            annotations:
              summary: Loan origination p95 latency is high
              description: The p95 latency on loan-origination is above 1.5 seconds for 10 minutes.
          - alert: LoanOriginationHigh5xxRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{application="loan-origination",status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{application="loan-origination"}[5m])), 0.001)
              ) > 0.03
            for: 5m
            labels:
              severity: critical
              service: loan-origination
            annotations:
              summary: Loan origination has elevated 5xx errors
              description: The 5xx error ratio on loan-origination is above 3 percent for 5 minutes.
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

spring:
  datasource:
    url: "jdbc:h2:mem:aml;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS aml\\;SET SCHEMA aml"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: aml_flyway_schema_history
    default-schema: aml
    create-schemas: true

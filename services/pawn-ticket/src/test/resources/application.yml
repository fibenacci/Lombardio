spring:
  datasource:
    url: "jdbc:h2:mem:pawn_ticket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS pawn_ticket\\;SET SCHEMA pawn_ticket"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: pawn_ticket_flyway_schema_history
    default-schema: pawn_ticket
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: pawn_ticket
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/lombardio/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/lombardio

identity-access:
  base-url: http://localhost:8081

internal:
  service-token: test-internal-token

app:
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition,Location
    max-age-seconds: 3600

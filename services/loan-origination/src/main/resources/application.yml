spring:
  application:
    name: loan-origination
  datasource:
    url: ${LOAN_ORIGINATION_DB_URL}
    username: ${LOAN_ORIGINATION_DB_USERNAME}
    password: ${LOAN_ORIGINATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: loan_origination
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8083

identity:
  base-url: ${IDENTITY_BASE_URL}

pawn-ticket:

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

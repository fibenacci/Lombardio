spring:
  datasource:
    url: jdbc:h2:mem:loan_origination;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: loan_origination
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

customer:
  base-url: http://localhost:8084

pawn-ticket:
  base-url: http://localhost:8085

kyc:
  base-url: http://localhost:8086

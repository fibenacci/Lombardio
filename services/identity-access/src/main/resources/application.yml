spring:
  application:
    name: identity-access
  datasource:
    url: ${IDENTITY_ACCESS_DB_URL}
    username: ${IDENTITY_ACCESS_DB_USERNAME}
    password: ${IDENTITY_ACCESS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

identity:
  security:
    encryption-key: ${IDENTITY_SECURITY_ENCRYPTION_KEY}

rate-limit:
  backend: ${RATE_LIMIT_BACKEND:memory}
  policies:
    login:
      max-attempts: 10
      window: 1m
    totp-verify:
      max-attempts: 10
      window: 5m
    delegations:
      max-attempts: 30
      window: 1m

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

spring:
  application:
    name: reporting-service

server:
  port: 8091

loan-origination:
  base-url: ${LOAN_ORIGINATION_BASE_URL}

pawn-ticket:
  base-url: ${PAWN_TICKET_BASE_URL}

lombardio:
  security:
    jwk-set-uri: ${LOMBARDIO_SECURITY_JWK_SET_URI}
    operator-client-id: ${LOMBARDIO_SECURITY_OPERATOR_CLIENT_ID}
    operator-access-cookie-name: ${APP_OPERATOR_SESSION_ACCESS_COOKIE_NAME:lombardio_operator_access}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
      allowed-methods: ${APP_CORS_ALLOWED_METHODS}
      allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
      exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
      max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

spring:
  datasource:
    url: "jdbc:h2:mem:platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS platform\\;SET SCHEMA platform"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: platform_flyway_schema_history
    default-schema: platform
    create-schemas: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: platform
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/lombardio/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/lombardio

identity-access:
  base-url: http://localhost:8081

integration:
  outbox:
    access-token: test-platform-outbox-token
  rabbitmq:
    exchange: lombardio.domain
    publisher-batch-size: 25
    publisher-enabled: false

app:
  keycloak:
    server-url: http://localhost:8080
    realm: lombardio
    client-id: admin-cli
    admin-username: admin
    admin-password: admin
    operator-client-id: lombardio-app
  operator-session:
    refresh-cookie-name: lombardio_operator_refresh
    refresh-cookie-path: /
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
    refresh-cookie-max-age-seconds: 2592000
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition,Location
    max-age-seconds: 3600

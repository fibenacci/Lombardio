spring:
  application:
    name: platform
  datasource:
    url: ${PLATFORM_DB_URL}
    username: ${PLATFORM_DB_USERNAME}
    password: ${PLATFORM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: platform_flyway_schema_history
    default-schema: platform
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

server:
  port: 8082

integration:
  outbox:
    access-token: ${PLATFORM_OUTBOX_ACCESS_TOKEN}
  rabbitmq:
    exchange: ${INTEGRATION_RABBITMQ_EXCHANGE}
    publisher-batch-size: ${INTEGRATION_RABBITMQ_PUBLISHER_BATCH_SIZE}
    publisher-enabled: ${INTEGRATION_RABBITMQ_PUBLISHER_ENABLED}

app:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:lombardio}
    client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin_change_me}
    operator-client-id: ${KEYCLOAK_OPERATOR_CLIENT_ID:lombardio-app}
  operator-session:
    cookie-name: ${APP_OPERATOR_SESSION_COOKIE_NAME:lombardio_operator_session}
    cookie-path: ${APP_OPERATOR_SESSION_COOKIE_PATH:/}
    cookie-secure: ${APP_OPERATOR_SESSION_COOKIE_SECURE:false}
    cookie-same-site: ${APP_OPERATOR_SESSION_COOKIE_SAME_SITE:Lax}
    cookie-max-age-seconds: ${APP_OPERATOR_SESSION_COOKIE_MAX_AGE_SECONDS:2592000}
    encryption-key: ${APP_OPERATOR_SESSION_ENCRYPTION_KEY}
  operator-bff:
    targets:
      auctions: ${APP_OPERATOR_BFF_AUCTION_BASE_URL:http://localhost:8089}
      auction: ${APP_OPERATOR_BFF_AUCTION_BASE_URL:http://localhost:8089}
      customers: ${APP_OPERATOR_BFF_IDENTITY_BASE_URL:http://localhost:8084}
      identity: ${APP_OPERATOR_BFF_IDENTITY_BASE_URL:http://localhost:8084}
      pawn-tickets: ${APP_OPERATOR_BFF_PAWN_TICKET_BASE_URL:http://localhost:8085}
      pawnticket: ${APP_OPERATOR_BFF_PAWN_TICKET_BASE_URL:http://localhost:8085}
      online-auctions: ${APP_OPERATOR_BFF_ONLINE_AUCTION_BASE_URL:http://localhost:8090}
      online-auction: ${APP_OPERATOR_BFF_ONLINE_AUCTION_BASE_URL:http://localhost:8090}
      loan-originations: ${APP_OPERATOR_BFF_ORIGINATION_BASE_URL:http://localhost:8083}
      origination: ${APP_OPERATOR_BFF_ORIGINATION_BASE_URL:http://localhost:8083}
      reports: ${APP_OPERATOR_BFF_REPORTING_BASE_URL:http://localhost:8091}
      reporting: ${APP_OPERATOR_BFF_REPORTING_BASE_URL:http://localhost:8091}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

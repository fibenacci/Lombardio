spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS identity_intelligence
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_intelligence
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity_intelligence
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/lombardio/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/lombardio

external-crm:
  base-url: http://localhost:8081

regula:
  base-url: ${REGULA_BASE_URL:http://localhost:8087}

pawn-ticket:
  base-url: http://localhost:8085

integration:
  base-url: http://localhost:8092

customer:
  internal-service-token: test-internal-token

customer-portal:
  public-base-url: http://localhost:5173/portal
  session:
    cookie-name: lombardio_customer_portal_session
    cookie-path: /
    cookie-secure: false
    cookie-same-site: Lax
    cookie-max-age-seconds: 2592000
    session-ttl-seconds: 2592000
    cleanup-fixed-delay-ms: 3600000

app:
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Content-Disposition,Location
    max-age-seconds: 3600

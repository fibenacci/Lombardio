spring:
  datasource:
    url: jdbc:h2:mem:customer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: customer
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

kyc:
  base-url: http://localhost:8086

identity-access:
  base-url: http://localhost:8081

pawn-ticket:
  base-url: http://localhost:8085

integration:
  base-url: http://localhost:8092

customer:
  internal-service-token: test-internal-token

customer-portal:
  public-base-url: http://localhost:5173/portal

app:
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
    exposed-headers:
      - Content-Disposition
    max-age-seconds: 3600

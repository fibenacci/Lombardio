spring:
  application:
    name: identity-intelligence
  datasource:
    url: ${IDENTITY_INTELLIGENCE_DB_URL}
    username: ${IDENTITY_INTELLIGENCE_DB_USERNAME}
    password: ${IDENTITY_INTELLIGENCE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: identity_intelligence
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8084

external-crm:
  base-url: ${EXTERNAL_CRM_BASE_URL:}

regula:
  base-url: ${REGULA_BASE_URL:${DOCUMENT_OCR_BASE_URL:http://localhost:8087}}

pawn-ticket:
  base-url: ${PAWN_TICKET_BASE_URL:http://localhost:8085}

integration:
  base-url: ${INTEGRATION_BASE_URL:http://localhost:8092}

customer:
  internal-service-token: ${CUSTOMER_INTERNAL_SERVICE_TOKEN:REPLACE_WITH_SECURE_TOKEN}

customer-portal:
  public-base-url: ${CUSTOMER_PORTAL_PUBLIC_BASE_URL:http://localhost:5173/portal}
  session:
    cookie-name: ${CUSTOMER_PORTAL_SESSION_COOKIE_NAME:lombardio_customer_portal_session}
    cookie-path: ${CUSTOMER_PORTAL_SESSION_COOKIE_PATH:/}
    cookie-secure: ${CUSTOMER_PORTAL_SESSION_COOKIE_SECURE:false}
    cookie-same-site: ${CUSTOMER_PORTAL_SESSION_COOKIE_SAME_SITE:Lax}
    cookie-max-age-seconds: ${CUSTOMER_PORTAL_SESSION_COOKIE_MAX_AGE_SECONDS:2592000}
    session-ttl-seconds: ${CUSTOMER_PORTAL_SESSION_TTL_SECONDS:2592000}
    cleanup-fixed-delay-ms: ${CUSTOMER_PORTAL_SESSION_CLEANUP_FIXED_DELAY_MS:3600000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  datasource:
    url: jdbc:h2:mem:auction;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS auction
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    default-schema: auction
    table: auction_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: none

identity-access:
  base-url: http://localhost:8081

spring:
  application:
    name: auction-service
  datasource:
    url: ${AUCTION_DB_URL}
    username: ${AUCTION_DB_USERNAME}
    password: ${AUCTION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auction
    table: auction_flyway_schema_history
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8089

lombardio:
  security:
    jwk-set-uri: ${LOMBARDIO_SECURITY_JWK_SET_URI}
    operator-client-id: ${LOMBARDIO_SECURITY_OPERATOR_CLIENT_ID}
    operator-access-cookie-name: ${APP_OPERATOR_SESSION_ACCESS_COOKIE_NAME:lombardio_operator_access}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
      allowed-methods: ${APP_CORS_ALLOWED_METHODS}
      allowed-headers: ${APP_CORS_ALLOWED_HEADERS}
      exposed-headers: ${APP_CORS_EXPOSED_HEADERS}
      max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
